<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register page</title>
</head>
<body>
    
    <form id="main" >
        <h1>Register New Employee</h1>
        <label>Employee ID</label>
        <input type="number" [(ngModel)]="employee.empid" placeholder="Enter employee id"  required>
        <label>Employee Name</label>
        <input type="text" [(ngModel)]="employee.empname" placeholder="Enter employee Name" required>
        <label>Employee Salary</label>
        <input type="number" [(ngModel)]="employee.salary" placeholder="Enter employee Salary"  maxlength="7" required>
        <button (submit)="register()" routerLink="/emp" type="submit">SUBMIT</button>
    </form>
</body>
</html>
